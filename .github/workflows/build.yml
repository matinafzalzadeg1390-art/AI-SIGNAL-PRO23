
name: AI SIGNAL PRO 23 - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP_FILE="AI-SIGNAL-Binance-Live-Icon-AutoBuild.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          PROJECT_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("app/build.gradle.kts not found")

          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          if "kotlinOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )
          else:
              import re
              s = re.sub(
                  r'jvmTarget\s*=\s*["\'].*?["\']',
                  'jvmTarget = "17"',
                  s
              )

          p.write_text(s)
          print("JVM targets configured successfully")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" --no-daemon assembleDebug
          else
            gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SIGNAL-PRO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
